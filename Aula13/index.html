<!DOCTYPE html>
<htm lang="pt-br">
    <head>
        <title>Conteudo Aula 13 - HTML</title>

    <style>

     .destaque {
        color: red;
         font-weight: bold;
        font-size: 150%;
        text-decoration: underline;
        }

        .cidade {
            background-color: rgb(216, 20, 20);
            padding: 10px;
            color: white;
             border: 4px solid black;

        }

        .centralizado {
            color: rgb(255, 255, 255);
            text-decoration: black;
            text-align: center;
            border: 4px solid black;
        }
    
        .mesma-classe {
            background-color: darkorange;
            padding: 4px;
            font-size: 20px;
            border: 4px solid black;
        }


    </style>

    </head>
    <body>

        <h1>Class no HTML</h1>

        <p>Exemplo de <span class="destaque">importância</span> no conteudo</p>

        <p>Exemplo de <span class="destaque">importância</span> no conteudo</p>
        
        <hr>

        <h3>Definindo mais de uma classe para elementos</h3>

        <h2 class="cidade centralizado">Brasil</h2>
        <h2 class="cidade">Argentina</h2>
        <h2 class="cidade">Colombia</h2>


        <br>

        <h3>Elementos diferentes com a mesma classe</h3>

        <h4 class="mesma-classe">Isso é um h4</h4>
        <P class="mesma-classe">Isso é um paragrafo </P>





    </body>
</html>
