<!DOCTYPE html>
<html>
    <head>
        <title>Conteudo Aula 15 - HTML</title>

        <style>

            .ex1 {
                background-color: rgb(251, 4, 4);
                border: none;
                width: 130px;
                height: 35px;
                font-family: monospace;
                font-weight: bold;
                color: rgb(0, 0, 0);
                cursor: pointer;
            }

            .ex1:hover {
                background-color: #c4a57d;
            }











        </style>


    </head>

    <body>

        <h1>Botoes no HTML</h1>

        <h3>Estilizando Botoes</h3>

        <button class="ex1">Clique aqui</button>

        <hr>

        <h3>Botao desativado</h3>

        <button disabled>Botao</button>

        <hr>

        <h3>Botao do javascript</h3>

        <button onclick="alert (' Seu navegador agora esta carregado de virus');">Clique aqui</button>















    </body>
</html>
