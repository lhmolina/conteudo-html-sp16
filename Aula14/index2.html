<!DOCTYPE html>
<html long="pt-br"
<head>
    <title>Conteudo aula 14 - html</title>
</head>
<body>
   
    <h1>Java script no HTML</h1>

   <h3>Alterando valores de atributos no javascript</h3>

    <img id="lamp-elemento" src="off.gif" width="100" height="180">

    <br>

    <button onclick="controlarLampada(1)">ligar</button>
    <button onclick="controlarLampada(0)">desligar</button>

    <script>

        function controlarLampada(interruptor) {
            var imagem;
            if (interruptor == 0) {
                imagem = "off.gif";
            }else{
                imagem = "on.gif";
            }
            document.getElementById("lamp-elemento").src = imagem;
        }







    </script>




</body>
</html>
