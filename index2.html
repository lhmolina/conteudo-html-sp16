<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <title>Conteúdo Aula 13 - HTML</title>

        <style>

            #meu-h2{
                background-color: darkblue;
                color: ghostwhite;
                border: 4px solid goldenrod;
                padding: 10px;
            }
        </style>
    </head>
    <body>

        <h1>ID em HTML</h1>

        <h2 id="meu-h2">Eu sou um h2 com id</h2>

        <hr>

        <h3 id="meu-h3">Turma sp16</h3>

        <button onclick="trocarConteudo()">Alterar conteudo</button>

        <script>

            function trocarConteudo() {
                document.getElementById('meu-h3').innerHTML = "Somente a dor coletiva gera uniao";
                document.getElementById('meu-h3').style.color = "orangered";
                document.getElementById("meu-h3").style.fontsize = "28px";
            }
             



        </script>











    </body>
</html>
